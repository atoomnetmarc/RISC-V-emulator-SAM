; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs     =
  *_env.ini

[common_sam]
build_flags       = -Og -g3 -fno-reorder-blocks -Wno-packed-bitfield-compat
build_unflags     = -Os -flto
debug_build_flags = -DDEBUG -g3 -Og
debug_init_break  = tbreak setup
lib_deps          = symlink://../RISC-V-emulator
platform          = atmelsam@~8.3.0
framework         = arduino
lib_ldf_mode      = chain
extra_scripts     =
  copy_hex.py
  lss.py
upload_protocol   = atmel-ice
upload_flags      =
debug_tool        = atmel-ice

[env:mzeroUSB]
board = mzeroUSB
build_flags       = ${common_sam.build_flags} -D RVE_E_M=1 -D RVE_E_A=1 -D RVE_E_ZICSR=1
build_unflags     = ${common_sam.build_unflags}
debug_build_flags = ${common_sam.debug_build_flags}
debug_init_break  = ${common_sam.debug_init_break}
extra_scripts     = ${common_sam.extra_scripts}
framework         = ${common_sam.framework}
lib_deps          = ${common_sam.lib_deps}
lib_ldf_mode      = ${common_sam.lib_ldf_mode}
platform          = ${common_sam.platform}
upload_protocol   = ${common_sam.upload_protocol}
upload_flags      = ${common_sam.upload_flags}
debug_tool        = ${common_sam.debug_tool}
