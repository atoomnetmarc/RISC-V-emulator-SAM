; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs     =
  *_env.ini

[common_sam]
build_flags       =
  -Iinclude
  -Og -g3 -fno-reorder-blocks -Werror
  -Wno-packed-bitfield-compat
  -Wl,-Map,$BUILD_DIR/firmware.map
build_unflags     = -Os -flto
platform          = atmelsam@9.0.0
framework         = arduino
lib_deps          = symlink://../RISC-V-emulator
lib_ldf_mode      = chain
extra_scripts     =
  copy_hex.py
  lss.py
upload_protocol   = atmel-ice
upload_flags      =
debug_tool        = atmel-ice

; Debug-specific settings (SAM unique).
[debug_sam]
debug_build_flags = -DDEBUG -g3 -Og
debug_init_break  = tbreak setup

[env:mzeroUSB_RV32I]
extends           = common_sam
board             = mzeroUSB

[env:mzeroUSB_RV32IC]
extends           = common_sam
board             = mzeroUSB
build_flags       =
  ${common_sam.build_flags}
  -D RVE_E_C=1

[env:mzeroUSB_RV32IM]
extends           = common_sam
board             = mzeroUSB
build_flags       =
  ${common_sam.build_flags}
  -D RVE_E_M=1

